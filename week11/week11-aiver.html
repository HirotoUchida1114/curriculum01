<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プレミアム TODOリスト</title>
    <!-- Tailwind CSS & Lucide Icons (アイコン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 antialiased text-slate-800">

    <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 p-6 w-full max-w-md border border-slate-100">
        <!-- ヘッダー -->
        <div class="flex items-center gap-2 mb-6">
            <i data-lucide="check-square" class="w-6 h-6 text-indigo-600"></i>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">マイタスク</h1>
        </div>

        <!-- 入力エリア -->
        <div class="flex gap-2 mb-6">
            <input id="todoInput" type="text" placeholder="新しいタスクを追加..." 
                   class="flex-1 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all placeholder:text-slate-400">
            <button id="addBtn" class="bg-indigo-600 text-white text-sm font-semibold px-4 py-2.5 rounded-xl hover:bg-indigo-700 active:scale-95 transition-all shadow-sm shadow-indigo-200 flex items-center gap-1">
                <i data-lucide="plus" class="w-4 h-4"></i>追加
            </button>
        </div>

        <!-- リストエリア -->
        <ul id="todoList" class="space-y-2.5 max-h-[60vh] overflow-y-auto pr-1"></ul>
    </div>

    <script>
        // DOM要素のキャッシュ
        const todoInput = document.getElementById("todoInput");
        const addButton = document.getElementById("addBtn");
        const todoList = document.getElementById("todoList");

        // タスク追加処理
        const addTask = () => {
            const text = todoInput.value.trim(); // 前後の不要な空白を削除

            if (!text) return;

            // リストアイテムの生成
            const item = document.createElement("li");
            item.className = "flex items-center justify-between bg-slate-50 hover:bg-slate-100/80 rounded-xl px-4 py-3 border border-slate-100 transition-all group animate-fade-in";

            // 左側：チェックボックスとテキストのコンテナ
            const leftContainer = document.createElement("div");
            leftContainer.className = "flex items-center gap-3 flex-1 min-w-0";

            // カスタムチェックボックス風のボタン
            const checkBtn = document.createElement("button");
            checkBtn.className = "w-5 h-5 rounded-md border border-slate-300 bg-white flex items-center justify-center text-transparent hover:border-indigo-500 hover:bg-indigo-50 transition-all shrink-0";
            checkBtn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>';

            // タスク名
            const span = document.createElement("span");
            span.textContent = text;
            span.className = "text-sm text-slate-700 truncate select-none transition-all";

            // 右側：削除ボタン（ホバー時に目立たせる）
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "text-slate-400 hover:text-rose-500 md:opacity-0 group-hover:opacity-100 transition-all p-1 rounded-lg hover:bg-rose-50 shrink-0";
            deleteBtn.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i>';
            
            // 完了・未完了のトグルイベント
            checkBtn.addEventListener("click", () => {
                const isDone = span.classList.toggle("line-through");
                span.classList.toggle("text-slate-400", isDone);
                
                if (isDone) {
                    checkBtn.className = "w-5 h-5 rounded-md border border-indigo-600 bg-indigo-600 flex items-center justify-center text-white transition-all shrink-0";
                } else {
                    checkBtn.className = "w-5 h-5 rounded-md border border-slate-300 bg-white flex items-center justify-center text-transparent hover:border-indigo-500 hover:bg-indigo-50 transition-all shrink-0";
                }
            });

            // 削除イベント
            deleteBtn.addEventListener("click", () => {
                item.remove();
            });

            // 要素の組み立て
            leftContainer.appendChild(checkBtn);
            leftContainer.appendChild(span);
            item.appendChild(leftContainer);
            item.appendChild(deleteBtn);
            todoList.appendChild(item);

            // アイコンのリフレッシュ（Lucide用）
            lucide.createIcons();

            // 入力欄のクリアとフォーカス維持
            todoInput.value = "";
            todoInput.focus();
        };

        // イベントリスナーの登録
        addButton.addEventListener("click", addTask);

        todoInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.isComposing) { // IME確定時のEnter誤作動防止
                addTask();
            }
        });

        // 初回アイコン生成
        lucide.createIcons();
    </script>
</body>
</html>
