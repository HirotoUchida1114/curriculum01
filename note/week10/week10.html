<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub User Finder</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-6">
    <!-- タイトル -->
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800">GitHub User Finder</h1>
      <p class="text-sm text-slate-500 mt-1">GitHubのユーザー情報を検索します</p>
    </div>

    <!-- 入力フォーム -->
    <div class="space-y-3">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">ユーザー名</label>
        <input 
          type="text" 
          id="username" 
          placeholder="例: octocat" 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        >
      </div>
      <button 
        id="search-btn" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition flex items-center justify-center space-x-2"
      >
        <span id="btn-text">検索する</span>
      </button>
    </div>

    <!-- エラーメッセージ表示エリア -->
    <div id="error-message" class="hidden text-center text-red-500 font-medium p-3 bg-red-50 rounded-lg border border-red-200"></div>

    <!-- 結果表示エリア -->
    <div id="result-container" class="hidden border-t border-slate-100 pt-6 animate-fade-in">
      <div class="flex flex-col items-center text-center space-y-4">
        <!-- アバター画像 -->
        <img 
          id="avatar" 
          src="" 
          alt="Avatar" 
          class="w-24 h-24 rounded-full shadow-md border-2 border-slate-200"
        >
        
        <!-- ユーザー名と名前 -->
        <div>
          <h2 id="name" class="text-xl font-bold text-slate-800"></h2>
          <p id="login-name" class="text-sm text-slate-400 font-mono"></p>
        </div>

        <!-- 自己紹介 (Bio) -->
        <p id="bio" class="text-sm text-slate-600 max-w-xs px-2"></p>

        <!-- スタッツ (フォロワー / リポジトリ) -->
        <div class="grid grid-cols-2 gap-4 w-full bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
          <div>
            <span class="block text-xs font-medium text-slate-400 uppercase tracking-wider">フォロワー</span>
            <span id="followers" class="text-lg font-bold text-slate-700">0</span>
          </div>
          <div>
            <span class="block text-xs font-medium text-slate-400 uppercase tracking-wider">リポジトリ数</span>
            <span id="public-repos" class="text-lg font-bold text-slate-700">0</span>
          </div>
        </div>

        <!-- プロフィールへのリンク -->
        <a 
          id="profile-link" 
          href="#" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="inline-flex items-center text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline transition"
        >
          GitHubでプロフィールを見る ↗
        </a>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const usernameInput = document.getElementById('username');
    const searchBtn = document.getElementById('search-btn');
    const btnText = document.getElementById('btn-text');
    const errorMessage = document.getElementById('error-message');
    const resultContainer = document.getElementById('result-container');

    // DOM要素（結果表示用）
    const avatar = document.getElementById('avatar');
    const nameEl = document.getElementById('name');
    const loginNameEl = document.getElementById('login-name');
    const bioEl = document.getElementById('bio');
    const followersEl = document.getElementById('followers');
    const publicReposEl = document.getElementById('public-repos');
    const profileLink = document.getElementById('profile-link');

    // 検索処理
    async function fetchGitHubUser() {
      const username = usernameInput.value.trim();
      
      // 入力が空の場合は処理をスキップ
      if (!username) {
        alert('ユーザー名を入力してください。');
        return;
      }

      // UIの状態をリセット & ローディング状態にする
      errorMessage.classList.add('hidden');
      resultContainer.classList.add('hidden');
      searchBtn.disabled = true;
      btnText.textContent = '読み込み中...';
      searchBtn.classList.add('opacity-75', 'cursor-not-allowed');

      try {
        const response = await fetch(`https://api.github.com/users/${username}`);
        
        // Consoleでのデータ確認用要件
        console.log('Response Status:', response.status);

        if (!response.ok) {
          // 404などで response.ok が false の場合
          throw new Error('ユーザーが見つかりませんでした');
        }

        const data = await response.json();
        
        // 取得したデータをConsoleに出力（PR本文に書く内容の確認用）
        console.log('取得したユーザーデータ:', data);

        // 各要素にデータを流し込み
        avatar.src = data.avatar_url || '';
        nameEl.textContent = data.name || data.login; // 名前が登録されていない場合はユーザー名を表示
        loginNameEl.textContent = `@${data.login}`;
        bioEl.textContent = data.bio || '自己紹介が登録されていません。';
        followersEl.textContent = data.followers.toLocaleString();
        publicReposEl.textContent = data.public_repos.toLocaleString();
        profileLink.href = data.html_url;

        // 結果を表示
        resultContainer.classList.remove('hidden');

      } catch (error) {
        console.error('エラーが発生しました:', error);
        // エラーメッセージを表示
        errorMessage.textContent = error.message === 'ユーザーが見つかりませんでした' 
          ? 'ユーザーが見つかりませんでした' 
          : '通信エラーが発生しました。時間を置いて再度お試しください。';
        errorMessage.classList.remove('hidden');
      } finally {
        // ローディング状態を解除
        searchBtn.disabled = false;
        btnText.textContent = '検索する';
        searchBtn.classList.remove('opacity-75', 'cursor-not-allowed');
      }
    }

    // イベントリスナーの登録
    searchBtn.addEventListener('click', fetchGitHubUser);
    
    // Enterキーでも検索できるように設定
    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        fetchGitHubUser();
      }
    });
  </script>
</body>
</html>
